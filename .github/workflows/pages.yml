name: Refresh and publish market data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"

permissions: {}

concurrency:
  group: market-observatory-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      refresh: ${{ steps.freshness.outputs.refresh }}
    permissions:
      contents: read
    steps:
      - name: Check the last public snapshot
        id: freshness
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from urllib.request import urlopen

          refresh = True
          if os.environ["TRIGGER"] == "schedule":
              owner, repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)
              url = f"https://{owner.lower()}.github.io/{repo}/data/market.json"
              try:
                  with urlopen(url, timeout=10) as response:
                      stamp = json.load(response)["asOf"]
                  age = (datetime.now(timezone.utc) - datetime.fromisoformat(stamp.replace("Z", "+00:00"))).total_seconds()
                  refresh = not 0 <= age < 20 * 60
                  print(f"Public snapshot age: {age:.0f} seconds")
              except (OSError, KeyError, ValueError):
                  print("No usable public snapshot. Collecting new data.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"refresh={str(refresh).lower()}", file=output)
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.freshness.outputs.refresh == 'true'
        with:
          persist-credentials: false
      - name: Collect and package the public site
        if: steps.freshness.outputs.refresh == 'true'
        run: python3 build.py
        env:
          MARKET_CACHE_URL: ${{ vars.MARKET_CACHE_URL }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: steps.freshness.outputs.refresh == 'true'
        with:
          path: _site
          retention-days: 1

  publish:
    needs: build
    if: needs.build.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
